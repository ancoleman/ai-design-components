name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-commands/**'
      - '.claude-plugin/**'
      - 'evaluation/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-commands/**'
      - '.claude-plugin/**'
      - 'evaluation/**'
      - 'scripts/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  validate-structure:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate skill directory structure
        run: |
          echo "Validating skill directory structure..."

          # Check that each skill has required files
          errors=0

          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")

            # Skip non-skill directories
            if [[ "$skill_name" == "node_modules" ]] || [[ "$skill_name" == "__pycache__" ]]; then
              continue
            fi

            # Check for SKILL.md
            if [[ ! -f "$skill_dir/SKILL.md" ]]; then
              echo "ERROR: $skill_name is missing SKILL.md"
              errors=$((errors + 1))
            else
              echo "✓ $skill_name has SKILL.md"

              # Validate SKILL.md frontmatter
              if ! head -n 1 "$skill_dir/SKILL.md" | grep -q "^---$"; then
                echo "ERROR: $skill_name/SKILL.md missing frontmatter"
                errors=$((errors + 1))
              fi
            fi

            # Check for references/ directory (optional but recommended)
            if [[ -d "$skill_dir/references" ]]; then
              ref_count=$(find "$skill_dir/references" -name "*.md" | wc -l)
              echo "  - $ref_count reference files"
            fi

            # Check for examples/ directory (optional)
            if [[ -d "$skill_dir/examples" ]]; then
              example_count=$(find "$skill_dir/examples" -type f | wc -l)
              echo "  - $example_count example files"
            fi
          done

          if [[ $errors -gt 0 ]]; then
            echo ""
            echo "Found $errors validation errors"
            exit 1
          fi

          echo ""
          echo "All skills validated successfully!"

      - name: Count skills and resources
        run: |
          echo "=== Skills Summary ==="
          skill_count=$(find skills -maxdepth 1 -type d | wc -l)
          skill_count=$((skill_count - 1))  # Exclude skills/ itself
          echo "Total skills: $skill_count"

          skill_md_count=$(find skills -name "SKILL.md" | wc -l)
          echo "Skills with SKILL.md: $skill_md_count"

          ref_count=$(find skills -path "*/references/*.md" | wc -l)
          echo "Reference documents: $ref_count"

          example_count=$(find skills -path "*/examples/*" -type f ! -path "*/node_modules/*" | wc -l)
          echo "Example files: $example_count"

          script_count=$(find skills -path "*/scripts/*" -type f | wc -l)
          echo "Script files: $script_count"

  validate-registries:
    name: Validate Skillchain Registries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate registry files
        run: |
          echo "Validating skillchain registries..."

          python3 << 'EOF'
          import yaml
          import sys
          from pathlib import Path

          registries_dir = Path(".claude-commands/_skillchain/_registries")
          errors = []

          # Check index exists
          index_file = registries_dir / "_index.yaml"
          if not index_file.exists():
              errors.append(f"Missing registry index: {index_file}")
              print(f"ERROR: {errors[-1]}")
              sys.exit(1)

          with open(index_file) as f:
              index = yaml.safe_load(f)

          print(f"Registry version: {index.get('version', 'unknown')}")
          print(f"Total skills declared: {index.get('total_skills', 0)}")

          domains = index.get("domains", {})
          total_skill_count = 0

          for domain, info in domains.items():
              registry_file = registries_dir / info.get("file", f"{domain}.yaml")

              if not registry_file.exists():
                  errors.append(f"Missing registry file: {registry_file}")
                  print(f"ERROR: {errors[-1]}")
                  continue

              with open(registry_file) as f:
                  registry = yaml.safe_load(f)

              skills = registry.get("skills", {})
              skill_count = len(skills) if isinstance(skills, dict) else 0
              total_skill_count += skill_count

              print(f"  {domain}: {skill_count} skills")

              # Validate each skill has required fields
              for skill_name, config in (skills.items() if isinstance(skills, dict) else []):
                  if not isinstance(config, dict):
                      continue

                  if "keywords" not in config:
                      errors.append(f"{domain}/{skill_name}: missing keywords")
                  elif "primary" not in config.get("keywords", {}):
                      errors.append(f"{domain}/{skill_name}: missing primary keywords")

          print(f"\nTotal skills in registries: {total_skill_count}")

          if errors:
              print(f"\n{len(errors)} validation errors:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          print("\nAll registries validated successfully!")
          EOF

  validate-blueprints:
    name: Validate Blueprints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate blueprint files
        run: |
          echo "Validating skillchain blueprints..."

          blueprints_dir=".claude-commands/_skillchain/blueprints"
          errors=0

          for bp_file in "$blueprints_dir"/*.md; do
            bp_name=$(basename "$bp_file" .md)

            # Check file size (should be substantial)
            line_count=$(wc -l < "$bp_file")
            if [[ $line_count -lt 100 ]]; then
              echo "WARNING: $bp_name has only $line_count lines (expected 100+)"
            else
              echo "✓ $bp_name: $line_count lines"
            fi

            # Check for required sections
            if ! grep -q "## Trigger Keywords" "$bp_file"; then
              echo "ERROR: $bp_name missing 'Trigger Keywords' section"
              errors=$((errors + 1))
            fi

            if ! grep -q "## Skill Chain" "$bp_file"; then
              echo "ERROR: $bp_name missing 'Skill Chain' section"
              errors=$((errors + 1))
            fi

            if ! grep -q "## Pre-configured Defaults" "$bp_file"; then
              echo "ERROR: $bp_name missing 'Pre-configured Defaults' section"
              errors=$((errors + 1))
            fi
          done

          blueprint_count=$(ls -1 "$blueprints_dir"/*.md 2>/dev/null | wc -l)
          echo ""
          echo "Total blueprints: $blueprint_count"

          if [[ $errors -gt 0 ]]; then
            echo "Found $errors validation errors"
            exit 1
          fi

          echo "All blueprints validated successfully!"

  validate-marketplace:
    name: Validate Marketplace Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate marketplace.json
        run: |
          echo "Validating marketplace.json..."

          python3 << 'EOF'
          import json
          import sys
          from pathlib import Path

          marketplace_file = Path(".claude-plugin/marketplace.json")

          if not marketplace_file.exists():
              print("ERROR: marketplace.json not found")
              sys.exit(1)

          with open(marketplace_file) as f:
              marketplace = json.load(f)

          # Required fields
          required = ["name", "owner", "plugins"]
          for field in required:
              if field not in marketplace:
                  print(f"ERROR: Missing required field: {field}")
                  sys.exit(1)

          print(f"Marketplace: {marketplace['name']}")
          print(f"Version: {marketplace.get('version', 'unknown')}")
          print(f"Plugin groups: {len(marketplace['plugins'])}")

          # Validate each plugin
          errors = []
          for plugin in marketplace["plugins"]:
              plugin_name = plugin.get("name", "unknown")

              if "skills" in plugin:
                  for skill_path in plugin["skills"]:
                      skill_dir = Path(skill_path.replace("./", ""))
                      skill_md = skill_dir / "SKILL.md"

                      if not skill_dir.exists():
                          errors.append(f"{plugin_name}: skill directory not found: {skill_path}")
                      elif not skill_md.exists():
                          errors.append(f"{plugin_name}: SKILL.md not found in {skill_path}")

          if errors:
              print(f"\n{len(errors)} validation errors:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          print("\nMarketplace validated successfully!")
          EOF

  run-evaluation:
    name: Run Skillchain Evaluation
    runs-on: ubuntu-latest
    needs: [validate-structure, validate-registries, validate-blueprints, validate-marketplace]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run evaluation scenarios
        run: |
          if [[ -f "evaluation/evaluate.py" ]]; then
            python3 evaluation/evaluate.py --report --output evaluation_results.json

            # Show summary (allow failure for now - baseline)
            echo ""
            echo "Evaluation complete. See report above for details."
          else
            echo "Evaluation script not found, skipping..."
          fi
        continue-on-error: true

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation/evaluation_results.json
          if-no-files-found: ignore

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-structure, validate-registries, validate-blueprints, validate-marketplace, run-evaluation]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== Validation Summary ==="
          echo ""

          if [[ "${{ needs.validate-structure.result }}" == "success" ]]; then
            echo "✓ Skill Structure: PASSED"
          else
            echo "✗ Skill Structure: FAILED"
          fi

          if [[ "${{ needs.validate-registries.result }}" == "success" ]]; then
            echo "✓ Registries: PASSED"
          else
            echo "✗ Registries: FAILED"
          fi

          if [[ "${{ needs.validate-blueprints.result }}" == "success" ]]; then
            echo "✓ Blueprints: PASSED"
          else
            echo "✗ Blueprints: FAILED"
          fi

          if [[ "${{ needs.validate-marketplace.result }}" == "success" ]]; then
            echo "✓ Marketplace: PASSED"
          else
            echo "✗ Marketplace: FAILED"
          fi

          if [[ "${{ needs.run-evaluation.result }}" == "success" ]]; then
            echo "✓ Evaluation: PASSED"
          else
            echo "⚠ Evaluation: INCOMPLETE (baseline mode)"
          fi

          echo ""
          echo "=== End Summary ==="
