[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-agent-manager"
version = "0.1.0"
description = "A Python library for managing Claude AI subagents with session control, event streaming, and process orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Anton Coleman", email = "acoleman@paloaltonetworks.com"}
]
keywords = ["claude", "ai", "agent", "orchestration", "subprocess", "event-streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# No required dependencies - stdlib only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "pyyaml>=6.0.0",
]
watch = [
    "watchdog>=3.0.0",
]
ui = [
    "rich>=13.5.0",
]
skillchain = [
    "pyyaml>=6.0.0",
]
all = [
    "watchdog>=3.0.0",
    "rich>=13.5.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
claude-agent = "claude_agent_manager.cli.main:main"

[project.urls]
Homepage = "https://github.com/ancoleman/ai-design-components"
Documentation = "https://ancoleman.github.io/ai-design-components/"
Repository = "https://github.com/ancoleman/ai-design-components"
Issues = "https://github.com/ancoleman/ai-design-components/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_agent_manager*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
claude_agent_manager = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=claude_agent_manager --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
